<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <filter id="blur8">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>

  <!-- 背景渐变 -->
  <rect width="300" height="300" fill="url(#bg8)"/>

  <!-- 装饰圆形 - 玻璃拟态效果 -->
  <circle cx="75" cy="80" r="65" fill="#ffffff" opacity="0.1" filter="url(#blur8)"/>
  <circle cx="240" cy="215" r="85" fill="#ffffff" opacity="0.08" filter="url(#blur8)"/>

  <!-- 中心图标容器 -->
  <g transform="translate(150, 150)">
    <!-- 图标背景圆 - 玻璃效果 -->
    <circle cx="0" cy="0" r="70" fill="#ffffff" opacity="0.25"/>
    <circle cx="0" cy="0" r="70" fill="url(#bg8)" opacity="0.3"/>

    <!-- 图标 -->
    <g id="icon"></g>
  </g>

  <!-- 顶部高光 -->
  <ellipse cx="150" cy="60" rx="120" ry="40" fill="#ffffff" opacity="0.15"/>
</svg>
