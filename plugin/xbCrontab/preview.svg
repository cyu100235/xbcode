<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crontabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>
  </defs>
  
  <!-- 背景渐变 -->
  <rect width="300" height="300" fill="url(#crontabBg)"/>
  
  <!-- 装饰圆形 - 玻璃拟态效果 -->
  <circle cx="75" cy="80" r="65" fill="#ffffff" opacity="0.1" filter="url(#blur)"/>
  <circle cx="240" cy="215" r="85" fill="#ffffff" opacity="0.08" filter="url(#blur)"/>
  
  <!-- 中心图标容器 -->
  <g transform="translate(150, 150)">
    <!-- 图标背景圆 - 玻璃效果 -->
    <circle cx="0" cy="0" r="70" fill="#ffffff" opacity="0.25"/>
    <circle cx="0" cy="0" r="70" fill="url(#crontabBg)" opacity="0.3"/>
    
    <!-- 时钟图标 -->
    <g transform="scale(1.1)">
      <!-- 表盘 -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="#ffffff" stroke-width="4"/>
      
      <!-- 时针 -->
      <rect x="-2.5" y="-15" width="5" height="18" fill="#ffffff" rx="2.5"/>
      
      <!-- 分针 -->
      <rect x="-1.5" y="-25" width="3" height="28" fill="#ffffff" rx="1.5"/>
      
      <!-- 中心点 -->
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
      
      <!-- 刻度 -->
      <circle cx="0" cy="-28" r="2.5" fill="#ffffff"/>
      <circle cx="28" cy="0" r="2.5" fill="#ffffff"/>
      <circle cx="0" cy="28" r="2.5" fill="#ffffff"/>
      <circle cx="-28" cy="0" r="2.5" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- 顶部高光 -->
  <ellipse cx="150" cy="60" rx="120" ry="40" fill="#ffffff" opacity="0.15"/>
</svg>