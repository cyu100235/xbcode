    <style>
      html,
      body,
      #app {
        height: 100%;
      }

      #xbcode-link {
        display: none;
      }

      * {
        margin: 0;
        padding: 0;
      }

      /*
       * 字体只设置在正文与表单控件上，不要用 * 通配符。
       * amis 的 input-number 上下箭头依赖 .cxd-Number-handler 上的 iconfont 字体，
       * 通配符的 font-family 会直接覆盖该字体（优先级高于继承），导致箭头显示为空白方块。
       */
      body,
      button,
      input,
      select,
      textarea {
        font-family:
          'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial,
          sans-serif;
      }

      .preload__wrap {
        display: flex;
        flex-direction: column;
        letter-spacing: 1px;
        background:
          radial-gradient(900px 620px at 18% 8%, rgba(107, 140, 255, 0.22), transparent 62%),
          radial-gradient(820px 620px at 88% 92%, rgba(126, 224, 255, 0.14), transparent 62%),
          linear-gradient(160deg, #171b27 0%, #232939 46%, #2f3447 100%);
        position: fixed;
        left: 0;
        top: 0;
        height: 100%;
        width: 100%;
        z-index: 9999;
        transition: all 0.45s ease-in;
        opacity: 1;
        pointer-events: none;
        overflow: hidden;
      }

      .preload__wrap.is-hide {
        opacity: 0;
      }

      /* 背景网格与光晕 */
      .preload__bg {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
        background-size: 44px 44px;
        -webkit-mask-image: radial-gradient(circle at 50% 46%, #000 0%, transparent 72%);
        mask-image: radial-gradient(circle at 50% 46%, #000 0%, transparent 72%);
        animation: preload-grid 18s linear infinite;
      }

      .preload__container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        width: 100%;
        -moz-user-select: none;
        user-select: none;
        -webkit-user-select: none;
        flex-grow: 1;
        position: relative;
        padding: 0 24px;
        box-sizing: border-box;
        text-align: center;
      }

      .preload__name {
        font-size: 30px;
        color: #fff;
        letter-spacing: 5px;
        font-weight: bold;
        margin-bottom: 30px;
      }

      /* Logo 区域 */
      .preload__logo {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
        margin-bottom: 34px;
      }

      .preload__logo::before {
        content: '';
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .preload__logo::after {
        content: '';
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          rgba(126, 224, 255, 0) 0%,
          rgba(126, 224, 255, 0.9) 72%,
          rgba(107, 140, 255, 0.95) 90%,
          rgba(107, 140, 255, 0) 100%
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        animation: preload-spin 2.6s linear infinite;
        filter: drop-shadow(0 0 6px rgba(126, 224, 255, 0.55));
      }

      .preload__glow {
        position: absolute;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(107, 140, 255, 0.38), transparent 66%);
        animation: preload-pulse 3.6s ease-in-out infinite;
      }

      .preload__cube {
        position: relative;
        width: 70px;
        height: 70px;
        animation: preload-float 3.6s ease-in-out infinite;
        filter: drop-shadow(0 10px 22px rgba(107, 140, 255, 0.4));
      }

      .preload__title {
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 2px;
        margin: 0;
      }

      .preload__dots i {
        font-style: normal;
        opacity: 0.25;
        animation: preload-dot 1.4s ease-in-out infinite;
      }

      .preload__dots i:nth-child(2) {
        animation-delay: 0.18s;
      }

      .preload__dots i:nth-child(3) {
        animation-delay: 0.36s;
      }

      .preload__sub-title {
        color: #8b91a4;
        font-size: 12px;
        letter-spacing: 1px;
        margin-top: 12px;
      }

      .preload__bar {
        position: relative;
        width: 208px;
        height: 3px;
        margin-top: 28px;
        border-radius: 3px;
        background-color: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .preload__bar span {
        position: absolute;
        top: 0;
        left: 0;
        width: 38%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, #7ee0ff 35%, #6b8cff 70%, transparent);
        animation: preload-slide 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .preload__footer {
        position: relative;
        text-align: center;
        padding: 10px 0 22px 0;
      }

      .preload__footer a {
        font-size: 12px;
        color: #ababab;
        text-decoration: none;
      }

      .preload__footer #xbcode-link {
        display: none;
      }

      @keyframes preload-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes preload-float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes preload-pulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.94);
        }

        50% {
          opacity: 1;
          transform: scale(1.06);
        }
      }

      @keyframes preload-dot {
        0%,
        100% {
          opacity: 0.2;
        }

        50% {
          opacity: 1;
        }
      }

      @keyframes preload-slide {
        0% {
          transform: translateX(-105%);
        }

        100% {
          transform: translateX(275%);
        }
      }

      @keyframes preload-grid {
        0% {
          background-position:
            0 0,
            0 0;
        }

        100% {
          background-position:
            44px 44px,
            44px 44px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .preload__bg,
        .preload__logo::after,
        .preload__glow,
        .preload__cube,
        .preload__dots i,
        .preload__bar span {
          animation: none;
        }
      }
    </style>
