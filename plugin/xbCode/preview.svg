      <rect x="252" y="96" width="92" height="28" rx="10" fill="#F59E0B" fill-opacity="0.24" stroke="#F59E0B"/>
      <text x="298" y="115" text-anchor="middle" font-family="Segoe UI,PingFang SC,sans-serif" font-size="13" fill="#FDE68A">xbCrontab</text>
      <rect x="252" y="132" width="92" height="28" rx="10" fill="#F472B6" fill-opacity="0.24" stroke="#F472B6"/>
      <text x="298" y="151" text-anchor="middle" font-family="Segoe UI,PingFang SC,sans-serif" font-size="13" fill="#FBCFE8">xbUpload</text>
